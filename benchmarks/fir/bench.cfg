# shellcheck shell=bash
# Per-benchmark settings, sourced by load_bench (config.sh).
# Use model checking to remove redundant handshake logic (Dynamatic compile --rigidification).
export DYNAMATIC_RIGIDIFICATION="${DYNAMATIC_RIGIDIFICATION:-1}"  # 0 disables
# Only rigidify ready signals: skip ValidEquivalence properties (no valid_merger).
export DYNAMATIC_RIGIDIFICATION_VALID_MERGER="${DYNAMATIC_RIGIDIFICATION_VALID_MERGER:-0}"
# Buffer placement algorithm (Dynamatic compile --buffer-algorithm).
export DYNAMATIC_BUFFER_ALGORITHM="${DYNAMATIC_BUFFER_ALGORITHM:-fpga24}"
